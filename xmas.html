<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Christmas Surprise</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e0f7fa;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    overflow: hidden;
    transition: background 1s ease;
}

.box {
    width: 320px;
    height: 160px;
    background: linear-gradient(135deg, #fff9c4, #ffeb3b);
    border: 3px solid #4caf50;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: bold;
    color: #d32f2f;
    cursor: pointer;
    box-shadow: 0 0 50px #81c784, 0 0 80px #4caf50;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
    text-align: center;
}

.box:hover {
    transform: scale(1.2) rotate(-3deg);
    box-shadow: 0 0 70px #81c784, 0 0 100px #4caf50;
}

.after-open {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    text-align: center;
    transition: transform 0.5s cubic-bezier(0.25, 1.5, 0.5, 1);
}

.after-open.show {
    transform: translate(-50%, -50%) scale(1);
}

.after-open h1 {
    font-size: 60px;
    color: #d32f2f;
    margin-bottom: 15px;
    text-shadow: 0 0 25px #ffeb3b, 0 0 50px #4caf50, 0 0 80px #d32f2f;
    position: relative;
}

.after-open p {
    font-size: 26px;
    color: #4caf50;
    text-shadow: 0 0 20px #ffeb3b, 0 0 40px #81c784;
}

.designs, .ribbons, .sparkles {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
}

.circle {
    position: absolute;
    border-radius: 50%;
    animation: floatCircle 6s infinite ease-in-out;
    transform: scale(0);
}

.ribbon {
    position: absolute;
    width: 8px;
    height: 30px;
    background: linear-gradient(45deg, #4caf50, #d32f2f);
    transform: rotate(45deg) scale(0);
    border-radius: 4px;
    animation: floatRibbon 3s ease-out forwards;
}

.sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffeb3b;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0);
}

@keyframes floatCircle {
    0% {transform: translateY(100vh) scale(0); opacity: 0;}
    50% {transform: translateY(50vh) scale(1); opacity: 1;}
    100% {transform: translateY(-10vh) scale(0); opacity: 0;}
}

@keyframes floatRibbon {
    0% {opacity: 1; transform: rotate(45deg) scale(0) translateY(0);}
    100% {opacity: 0; transform: rotate(45deg) scale(1) translateY(-500px);}
}
</style>
</head>
<body>
<div class="box" id="openBox">CLICK TO OPEN 🎄</div>
<div class="after-open" id="afterOpen">
    <h1 id="message">Merry Christmas! 🎉</h1>
    <p>Wishing you a joyful and magical holiday season ✨</p>
</div>
<div class="designs" id="designs"></div>
<div class="ribbons" id="ribbons"></div>
<div class="sparkles" id="sparkles"></div>

<script>
const openBox = document.getElementById('openBox');
const afterOpen = document.getElementById('afterOpen');
const designs = document.getElementById('designs');
const ribbons = document.getElementById('ribbons');
const sparkles = document.getElementById('sparkles');
const message = document.getElementById('message');

function createSparkleAroundElement(el) {
    const rect = el.getBoundingClientRect();
    for (let i = 0; i < 80; i++) {
        let s = document.createElement('div');
        s.className = 'sparkle';
        let x = rect.left + Math.random() * rect.width;
        let y = rect.top + Math.random() * rect.height;
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        sparkles.appendChild(s);

        setTimeout(() => {
            s.style.transition = 'all 0.5s ease-out';
            s.style.opacity = '1';
            s.style.transform = `scale(1) translate(${(Math.random()-0.5)*200}px, ${(Math.random()-0.5)*200}px)`;
        }, 10);

        setTimeout(() => s.remove(), 1000); // 1 second visibility
    }
}

openBox.addEventListener('click', () => {
    openBox.style.transform = 'scale(0.6) rotate(-15deg)';
    setTimeout(() => {
        openBox.style.display = 'none';
        document.body.style.transition = 'transform 0.2s ease, background 0.5s ease';
        document.body.style.transform = 'scale(1.1)';
        document.body.style.background = 'linear-gradient(135deg, #e8f5e9, #fffde7)';
        setTimeout(() => document.body.style.transform = 'scale(1)', 200);

        afterOpen.style.display = 'block';
        afterOpen.classList.add('show');

        createSparkleAroundElement(message);

        for(let i = 0; i < 50; i++) {
            let circle = document.createElement('div');
            circle.className = 'circle';
            let size = Math.random() * 80 + 30;
            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.style.left = Math.random() * window.innerWidth + 'px';
            circle.style.background = `rgba(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*200)}, ${Math.floor(Math.random()*50)}, 0.5)`;
            circle.style.animationDuration = (Math.random() * 4 + 3) + 's';
            designs.appendChild(circle);
            setTimeout(() => { circle.style.transform = 'scale(1)'; }, 50);
            setTimeout(() => circle.remove(), 10000);
        }

        for(let i = 0; i < 40; i++) {
            let ribbon = document.createElement('div');
            ribbon.className = 'ribbon';
            ribbon.style.left = Math.random() * window.innerWidth + 'px';
            ribbon.style.top = Math.random() * window.innerHeight + 'px';
            ribbon.style.animationDuration = (Math.random() * 3 + 2) + 's';
            ribbons.appendChild(ribbon);
            setTimeout(() => ribbon.remove(), 4000);
        }

        for(let i = 0; i < 50; i++) {
            let confetti = document.createElement('div');
            confetti.style.position = 'absolute';
            confetti.style.width = '14px';
            confetti.style.height = '14px';
            confetti.style.background = `hsl(${Math.random()*120}, 100%, 50%)`;
            confetti.style.left = `${window.innerWidth/2}px`;
            confetti.style.top = `${window.innerHeight/2}px`;
            confetti.style.borderRadius = '50%';
            confetti.style.transform = 'translate(0,0) scale(0)';
            designs.appendChild(confetti);

            setTimeout(() => {
                confetti.style.transition = 'all 1.5s ease-out';
                confetti.style.transform = `translate(${(Math.random()-0.5)*1000}px, ${(Math.random()-0.5)*1000}px) scale(1)`;
                confetti.style.opacity = '0';
            }, 50);

            setTimeout(() => confetti.remove(), 1500);
        }

    }, 100);
});
</script>
</body>
</html>
